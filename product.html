<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Product - Purnima Jewellers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="product-page">
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Purnima Jewellers</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalog.html">Catalog</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="product-container mt-5 pt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <div class="product-image-container">
                        <img src="" id="productImage" class="img-fluid rounded" alt="Product">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="product-details">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">

                                <li class="breadcrumb-item active" id="categoryBreadcrumb"></li>
                            </ol>
                        </nav>
                        <h1 id="productCategory" class="mb-4"></h1>
                        <div class="mt-4">
                            <a href="#" class="btn btn-whatsapp btn-lg" id="whatsappBtn" target="_blank">
                                <i class="fab fa-whatsapp"></i> Enquire on WhatsApp
                            </a>
                            <a href="catalog.html" class="btn btn-outline-secondary btn-lg ms-2">
                                <i class="fas fa-arrow-left"></i> Back to Catalog
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <div class="social-links">
                <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-link"><i class="fab fa-facebook"></i></a>
                <a href="#" class="social-link"><i class="fab fa-whatsapp"></i></a>
            </div>
            <p>&copy; 2025 Purnima Jewellers. All rights reserved.</p>
        </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - Purnima Jewellers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="catalog-page">
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Purnima Jewellers</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="catalog.html">Catalog</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="catalog-header">
        <div class="container">
            <h1>Our Collection</h1>
            <div class="category-filter">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="antitarnish">Antitarnish Jewellery</button>
                <button class="filter-btn" data-category="bali">Bali Earrings</button>
                <button class="filter-btn" data-category="bangles">Bangles</button>
                <button class="filter-btn" data-category="bracelets">Bracelets</button>
                <button class="filter-btn" data-category="delicate-pendant">Delicate Pendant Sets</button>
                <button class="filter-btn" data-category="kundan-heavy">Kundan Heavy Sets</button>
                <button class="filter-btn" data-category="kundan">Kundan Earrings</button>
                <button class="filter-btn" data-category="ring-nath">Ring & Nath</button>
                <button class="filter-btn" data-category="sets">Complete Sets</button>
                <button class="filter-btn" data-category="silver">Silver Replicas</button>
                <button class="filter-btn" data-category="studs">Studs</button>
                <button class="filter-btn" data-category="temple">Temple Jewellery</button>
            </div>
        </div>
    </div>

    <div class="catalog-grid">
        <div class="container">
            <!-- Loading indicator -->
            <div id="loading-indicator" class="text-center mb-4" style="display: none;">
                <div class="spinner-border text-primary mb-2" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="loading-text mb-0">Loading products...</p>
                <p class="loading-progress small text-muted"></p>
            </div>

            <div class="row g-4" id="product-grid">
                <!-- Products will be loaded here dynamically -->
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" class="img-fluid" id="modalImage">
                    <div class="mt-4">
                        <a href="#" class="btn btn-whatsapp" target="_blank">
                            <i class="fab fa-whatsapp"></i> Enquire on WhatsApp
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <div class="social-links">
                <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-link"><i class="fab fa-facebook"></i></a>
                <a href="#" class="social-link"><i class="fab fa-whatsapp"></i></a>
            </div>
            <p>&copy; 2025 Purnima Jewellers. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="catalog.js"></script>
</body>
</html>
